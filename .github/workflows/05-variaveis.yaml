name: variaveis de ação do github
run-name: ${{ github.actor }} testando variaveis do github action

on: push

jobs:
  Explorando-github-actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "o job disparou ${{ github.event_name }}"
      - run: echo "o job disparou ${{ runner.os }}"
      - run: echo "o job disparou ${{ github.ref }}"
      - run: echo "o job disparou ${{ github.repository }}"

      - name: checkout do repository do codigo
        uses: actions/checkout@v4
      - run: echo repository ${{ github.repository }}
      - name: Listar os arquivos do repositório
        run: |
          ls ${{ github.workspace }}
          echo o status do job é ${{ job.status }}

